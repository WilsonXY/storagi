name: Check
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly (Monday 03:00 MYT) so runner, Node or npm drift shows up without PRs.
    - cron: '0 19 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            web/package-lock.json
      - run: npm run setup
      - run: npm run format:check
      - name: Install verified Gitleaks 8.30.1 (official Linux x64 binary)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - run: npm run secrets:history
      # The hover preview tests convert real images and videos with ffmpeg (libwebp, libx264).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run check
      - name: Install pinned browser for text handoff acceptance
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/text-browser" --no-save playwright@1.64.1
          "$RUNNER_TEMP/text-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/text-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          node -e 'console.log("CHROME_EXECUTABLE=" + require(process.argv[1]).chromium.executablePath())' "$RUNNER_TEMP/text-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Check actual-service text handoff in two browsers
        run: server/node_modules/.bin/tsx --test scripts/acceptance-text-browser.test.ts
